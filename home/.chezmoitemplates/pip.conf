{{- if .machine.codespace -}}
{{ .chezmoi.stdin }}
{{- else -}}
{{- $url := "https://packagefeedproxy.microsoft.io/pypi/simple" -}}
{{- $managed := printf "index-url = %s" $url -}}
{{- $input := .chezmoi.stdin | replaceAllRegex "\r\n" "\n" | trimSuffix "\n" | trimSuffix "\r" -}}
{{- $output := list -}}
{{- $foundGlobal := false -}}
{{- $inGlobal := false -}}
{{- if $input -}}
{{- range $line := splitList "\n" $input -}}
{{- if regexMatch `(?i)^\s*\[[^]]+\]\s*$` $line -}}
{{- if $inGlobal -}}
{{- $output = append $output $managed -}}
{{- end -}}
{{- $inGlobal = regexMatch `(?i)^\s*\[global\]\s*$` $line -}}
{{- if $inGlobal -}}
{{- $foundGlobal = true -}}
{{- end -}}
{{- $output = append $output $line -}}
{{- else if not (and $inGlobal (regexMatch `(?i)^\s*index-url\s*=` $line)) -}}
{{- $output = append $output $line -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if $inGlobal -}}
{{- $output = append $output $managed -}}
{{- else if not $foundGlobal -}}
{{- if $output -}}
{{- $output = append $output "" -}}
{{- end -}}
{{- $output = append $output "[global]" -}}
{{- $output = append $output $managed -}}
{{- end -}}
{{ printf "%s\n" (join "\n" $output) -}}
{{- end -}}
