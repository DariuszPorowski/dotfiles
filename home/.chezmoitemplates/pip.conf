{{- $profile := get .machine "profile" -}}
{{- if or .machine.ephemeral (not $profile) -}}
{{ .chezmoi.stdin -}}
{{- else -}}
{{- $work := eq $profile "work" -}}
{{- $managed := printf "index-url = %s" .packageFeeds.python -}}
{{- $eol := ternary "\r\n" "\n" (contains "\r\n" .chezmoi.stdin) -}}
{{- $input := .chezmoi.stdin | replace "\r\n" "\n" | trimSuffix "\n" -}}
{{- $output := list -}}
{{- $foundGlobal := false -}}
{{- $inGlobal := false -}}
{{- $explicit := false -}}
{{- $removed := false -}}
{{- if $input -}}
{{- range $line := splitList "\n" $input -}}
{{-   if regexMatch `^\s*\[[^]]+\]` $line -}}
{{-     if and $work $inGlobal (not $explicit) }}{{ $output = append $output $managed }}{{ end -}}
{{-     $inGlobal = regexMatch `(?i)^\s*\[global\]\s*(?:[#;].*)?$` $line -}}
{{-     $foundGlobal = or $foundGlobal $inGlobal -}}
{{-   end -}}
{{-   if and $inGlobal (or (eq $line $managed) (eq $line (trimSuffix "/" $managed))) -}}
{{-     $removed = true -}}
{{-   else -}}
{{-     if and $inGlobal (regexMatch `(?i)^\s*index[-_]url\s*[=:]` $line) }}{{ $explicit = true }}{{ end -}}
{{-     $output = append $output $line -}}
{{-   end -}}
{{- end -}}
{{- end -}}
{{- if $work -}}
{{-   if not $foundGlobal -}}
{{-     if $output }}{{ $output = append $output "" }}{{ end -}}
{{-     $output = append $output "[global]" -}}
{{-   end -}}
{{-   if and (not $explicit) (or $inGlobal (not $foundGlobal)) }}{{ $output = append $output $managed }}{{ end -}}
{{ printf "%s%s" (join $eol $output) $eol -}}
{{- else if not $removed -}}
{{ .chezmoi.stdin -}}
{{- else if ne (join "\n" $output) "[global]" -}}
{{ join $eol $output }}{{ if hasSuffix "\n" .chezmoi.stdin }}{{ $eol }}{{ end -}}
{{- end -}}
{{- end -}}
