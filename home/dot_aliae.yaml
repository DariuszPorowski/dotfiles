# yaml-language-server: $schema=https://aliae.dev/schema.json
# docs: https://aliae.dev/docs
---
alias:
  - name: docker
    value: 'podman{{ if eq .Shell "cmd" }} $*{{ end }}'
    if: hasCommand "podman"
  - name: docker-compose
    value: 'podman compose{{ if eq .Shell "cmd" }} $*{{ end }}'
    if: and (hasCommand "podman") (not (match .Shell "pwsh" "powershell"))
  - name: docker-compose
    type: function
    value: |
      if ($MyInvocation.ExpectingInput) { $input | podman compose @args }
      else { podman compose @args }
    if: and (hasCommand "podman") (match .Shell "pwsh" "powershell")
path:
  - value: |
      {{ .Home }}/bin/
      {{ .Home }}/local/bin/
      {{ .Home }}/go/bin/
      {{ .Home }}/.go/bin/
      {{ .Home }}/.local/bin/
      {{ .Home }}/.cargo/bin/
