# yaml-language-server: $schema=https://taskfile.dev/schema.json
# ~/.Taskfile.yml
#
# docs: https://taskfile.dev
#
# --- Windows ---
# winget install Task.Task
#
# --- macOS ---
# brew install go-task/tap/go-task
---
version: "3"

set: [pipefail]
shopt: [globstar]

dotenv: [.env, ".{{.ENV}}/.env", "{{.ENV}}/.env"]

vars:
  PWSH: pwsh -NonInteractive -NoProfile -NoLogo -Command
  PWSH_SCRIPT: pwsh -NonInteractive -NoProfile -NoLogo -File
  APT_UPDATE: sudo apt-get -o DPkg::Lock::Timeout=-1 update
  APT_INSTALL: sudo apt-get -o DPkg::Lock::Timeout=-1 install -y
#   REPO_ABS_ROOT_PATH:
#     sh: git rev-parse --show-toplevel
#   CURRENT_BRANCH:
#     sh: git rev-parse --abbrev-ref HEAD

includes:
  internal: .taskfiles/_internal.Taskfile.yml
  runtime: .taskfiles/runtime.Taskfile.yml
  api: .taskfiles/api.Taskfile.yml
  sh: .taskfiles/shell.Taskfile.yml
  gh: .taskfiles/github.Taskfile.yml
  go: .taskfiles/golang.Taskfile.yml
  js: .taskfiles/javascript.Taskfile.yml
  md: .taskfiles/markdown.Taskfile.yml
  # sec: .taskfiles/security.Taskfile.yml
  spell: .taskfiles/spell.Taskfile.yml
  tf: .taskfiles/terraform.Taskfile.yml
  yml: .taskfiles/yaml.Taskfile.yml
  # site: .taskfiles/site.Taskfile.yml
  # project: .taskfiles/project.Taskfile.yml
  k8s: .taskfiles/kubernetes.Taskfile.yml
  utils: .taskfiles/utils.Taskfile.yml

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  sysinfo:
    desc: Display system information
    silent: true
    cmds:
      # yamllint disable-line rule:quoted-strings
      - 'echo "OS: {{OS}}"' # windows, linux, darwin
      # yamllint disable-line rule:quoted-strings
      - 'echo "Architecture: {{ARCH}}"' # amd64, arm64, etc.
      # yamllint disable-line rule:quoted-strings
      - 'echo "CPU cores: {{numCPU}}"' # Number of CPU cores

  init:
    desc: List available tasks
    silent: true
    cmds:
      - task: runtime:setup
      # - fnm install {{.NODE_VERSION}}
      # - fnm use {{.NODE_VERSION}}
      # - node --version
      # - uv python install --default "$(cat .python-version)" --preview-features python-install-default
      # - python --version
      # - task: tools
    dir: "{{.USER_WORKING_DIR}}"

  tools:
    desc: Install tools
    vars:
      ITEMS:
        - api
        - sh
        - gh
        - go
        - js
        - md
        # - sec
        - spell
        - tf
        - yml
        # - site
        - k8s
        - utils
    cmds:
      - for: { var: ITEMS }
        task: "{{.ITEM}}:tools"

  lint:
    desc: Lint files
    vars:
      ITEMS:
        - api
        - sh
        - gh
        - js
        - md
        # - sec
        - spell
        - tf
        - yml
    deps:
      - for: { var: ITEMS }
        task: "{{.ITEM}}:lint"

  diff:
    desc: Check for differences
    silent: true
    status:
      - git diff --shortstat --exit-code
    cmds:
      - cmd: |
          echo "⚠️⚠️⚠️ Unexpected difference. Run 'task -g {{.CLI_ARGS}}' command and commit. ⚠️⚠️⚠️"
          echo
          echo "🛑🛑🛑 Uncommitted changes 🛑🛑🛑"
          echo
          git status --short
          echo
          echo "📝📝📝 Summary 📝📝📝"
          echo
          git diff --compact-summary
          echo
          echo "🔁🔁🔁 Differences 🔁🔁🔁"
          echo
          git --no-pager diff
          echo
          exit 1

  git:clean:
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - cmd: |
          git fetch --prune &&
          LC_ALL=C git for-each-ref --format='%(refname:lstrip=2) %(upstream:track)' refs/heads | {
            failed=0
            while read -r branch state; do
              [ "$state" = '[gone]' ] || continue
              git branch -d -- "$branch" || failed=1
            done
            exit "$failed"
          }
